services:
  postgres:
    image: postgres:16
    container_name: studyguide-postgres
    environment:
      POSTGRES_USER: studyguide
      POSTGRES_PASSWORD: studyguide
      POSTGRES_DB: studyguide
    ports:
      - "55432:5432"
    volumes:
      - studyguide_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyguide -d studyguide"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: studyguide-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - studyguide_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studyguide_pg:
  studyguide_redis:
